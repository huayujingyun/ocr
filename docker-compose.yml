version: '3.8'

services:
  card-ocr:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: card-ocr-app
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    volumes:
      - ./logs:/app/logs
    networks:
      - card-ocr-network

networks:
  card-ocr-network:
    driver: bridge
