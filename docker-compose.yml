version: '3.8'

services:
  # PaddleOCR后端服务
  paddleocr-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: paddleocr-service
    ports:
      - "8001:8001"
    volumes:
      - paddleocr-cache:/root/.paddleocr
      - ./logs:/app/logs
    environment:
      - USE_GPU=false
      - LANG=ch
      - OCR_PORT=8001
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - card-ocr-network

  # Next.js前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - PADDLEOCR_API_URL=http://paddleocr-service:8001
    container_name: card-ocr-frontend
    ports:
      - "5000:5000"
    environment:
      - PADDLEOCR_API_URL=http://paddleocr-service:8001
      - NODE_ENV=production
    depends_on:
      paddleocr-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - card-ocr-network

volumes:
  paddleocr-cache:
    driver: local

networks:
  card-ocr-network:
    driver: bridge
