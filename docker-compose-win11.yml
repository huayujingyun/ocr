version: '3.8'

services:
  # PaddleOCR后端服务（Win11 专用修复版）
  paddleocr-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.win11
    container_name: paddleocr-service-win11
    ports:
      - "8001:8001"
    volumes:
      - paddleocr-cache:/root/.paddleocr
      - ./logs:/app/logs
      - ./backend:/app
    environment:
      - USE_GPU=false
      - LANG=ch
      - OCR_PORT=8001
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - card-ocr-network

  # Next.js前端服务（使用国内镜像）
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.cn
      args:
        - PADDLEOCR_API_URL=http://paddleocr-service:8001
    container_name: card-ocr-frontend-win11
    ports:
      - "5000:5000"
    environment:
      - PADDLEOCR_API_URL=http://paddleocr-service:8001
      - NODE_ENV=production
    volumes:
      - ./logs:/app/logs
      - ./src:/app/src
    depends_on:
      paddleocr-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - card-ocr-network

volumes:
  paddleocr-cache:
    driver: local

networks:
  card-ocr-network:
    driver: bridge
